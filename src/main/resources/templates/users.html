<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <title>User List</title>
</head>
<body>
<h1>User List</h1>
<table border="1">
  <tr>
    <th>Name</th>
    <th>Email</th>
  </tr>
  <th:block th:each="user : ${users}">
    <tr>
      <td th:text="${user.name}"></td>
      <td th:text="${user.email}"></td>
    </tr>
  </th:block>
</table>
</body>
</html>
